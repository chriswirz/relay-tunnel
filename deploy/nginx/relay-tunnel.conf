# Example nginx config for the relay-tunnel rendezvous server.
#
# nginx terminates TLS and reverse-proxies the server's HTTP port - the
# WebSocket signaling channel, and the admin web interface and its API, which
# share that listener. The UDP reflection/relay port is NOT proxied by nginx:
# the server must observe each peer's real public address for hole punching to
# work, so UDP is exposed to the server directly (see the note at the bottom).
#
# Run the server listening on loopback for HTTP, and advertise the public URL:
#   relay-tunnel server \
#     --http 127.0.0.1:7000 \
#     --udp 0.0.0.0:7001 \
#     --public-udp relay.example.com:7001 \
#     --public-url wss://relay.example.com/signal
#
# Clients then use:  --server wss://relay.example.com/signal
#
# The admin interface is then at https://relay.example.com/ - and because it is
# reached over TLS here while the server itself listens on plain HTTP, set
# server.admin.trust_forwarded_headers in config.json so the X-Forwarded-Proto
# below is believed and the session cookie is marked Secure.
#
# The interface has its own administrator login, but it is also the only part of
# this server worth reaching from anywhere but a peer. If it should not be on the
# public internet at all, either restrict the two locations below (see the
# commented allow/deny), or turn it off entirely with --admin=false and proxy
# /signal alone.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    # WebSocket signaling endpoint.
    location /signal {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Signaling connections are long-lived; do not let nginx time them out.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The admin API. Split out from / only so its access rules can differ from
    # those of the interface that calls it.
    location /api/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uncomment to keep the API to an office or VPN range.
        # allow 203.0.113.0/24;
        # deny  all;
    }

    # The admin web interface, the health check and the OpenAPI document.
    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # This is what tells the server the browser arrived over TLS, so the
        # admin session cookie is marked Secure. It is believed only when
        # server.admin.trust_forwarded_headers is set in config.json.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uncomment to keep the interface to an office or VPN range. /signal
        # above is unaffected, so peers can still reach the server.
        # allow 203.0.113.0/24;
        # deny  all;
    }
}

# IMPORTANT: the UDP port (7001) must reach the relay-tunnel server directly,
# NOT through nginx. If UDP were proxied, the server would observe nginx's
# address instead of each peer's public address, which breaks hole punching.
#
# On the same host, bind the server's UDP to the public interface
# (--udp 0.0.0.0:7001) and open UDP 7001 in the firewall. On a separate host,
# forward UDP 7001 straight to the server. Either way advertise the reachable
# address with --public-udp so peers know where to send their probes.
#
# nginx's stream module CAN forward UDP, but doing so is counterproductive here
# for the reason above; prefer a direct path for UDP 7001.
