name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-packages:
    name: Linux packages (.deb/.rpm)
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o packaging/relay-tunnel ./cmd/relay-tunnel
          chmod +x packaging/relay-tunnel

      - name: Build .deb and .rpm
        env:
          ARCH: ${{ matrix.arch }}
          # deb/rpm require a numeric version; strip the leading "v" from the tag.
          PKG_VERSION: ${{ github.ref_name }}
        run: |
          export PKG_VERSION="${PKG_VERSION#v}"
          mkdir -p out
          nfpm package -f packaging/nfpm.yaml -p deb -t out/
          nfpm package -f packaging/nfpm.yaml -p rpm -t out/
          ls -l out

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" out/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: relay-tunnel-packages-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
